name: Live website media check
on:
  push:
    branches: [feature/ux-polish-rc1]
    paths:
      - '.github/workflows/live-web-check.yml'
      - 'scripts/check-live-website.cjs'
      - 'scripts/check-live-receivers.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-state-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze lib/features/live test/features/live
      - run: flutter test test/features/live/live_room_role_test.dart
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --prefix "$RUNNER_TEMP/live-check" playwright@1.58.2
      - name: Inspect active public stream transport without recording
        env:
          NODE_PATH: ${{ runner.temp }}/live-check/node_modules
        run: node scripts/check-live-receivers.cjs
      - name: Check actual Flutter website and embedded broadcaster
        env:
          NODE_PATH: ${{ runner.temp }}/live-check/node_modules
        run: node scripts/check-live-website.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-website-diagnostics
          path: live-website-diagnostics/
          retention-days: 3
