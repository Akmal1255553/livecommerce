name: Installable Android demo

on:
  workflow_dispatch:
  push:
    branches: [feature/ux-polish-rc1]
    paths:
      - '.github/workflows/demo-apk.yml'
      - 'mobile/android/**'

permissions:
  contents: read

concurrency:
  group: demo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Restore private demo signing key
        env:
          DEMO_KEYSTORE_B64: ${{ secrets.DEMO_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$DEMO_KEYSTORE_B64"
          printf '%s' "$DEMO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/livecommerce-demo.jks"
          chmod 600 "$RUNNER_TEMP/livecommerce-demo.jks"
      - name: Build installable release APK
        env:
          DEMO_KEYSTORE_PATH: ${{ runner.temp }}/livecommerce-demo.jks
          DEMO_KEYSTORE_PASSWORD: ${{ secrets.DEMO_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --release --target-platform android-arm,android-arm64 \
            --build-name 0.1.1 --build-number "$((20261011 + GITHUB_RUN_NUMBER))" \
            --dart-define=API_BASE_URL=https://livecommerce-api.onrender.com/api/v1
      - name: Verify signature and prepare files
        run: |
          mkdir -p build/demo-apk
          cp build/app/outputs/flutter-apk/app-release.apk build/demo-apk/LiveCommerce-0.1.1.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/demo-apk/LiveCommerce-0.1.1.apk
          "$BUILD_TOOLS/aapt" dump badging build/demo-apk/LiveCommerce-0.1.1.apk > build/demo-apk/android-manifest.txt
          cd build/demo-apk
          sha256sum LiveCommerce-0.1.1.apk > SHA256SUMS.txt
          printf 'Source commit: %s\nAPI: https://livecommerce-api.onrender.com/api/v1\n' "$GITHUB_SHA" > build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LiveCommerce-Android-APK
          path: mobile/build/demo-apk/
          if-no-files-found: error
          retention-days: 30
