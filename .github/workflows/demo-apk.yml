name: Installable Android demo

on:
  workflow_dispatch:
  push:
    branches: [feature/ux-polish-rc1]
    paths:
      - '.github/workflows/demo-apk.yml'
      - 'mobile/android/**'
      - 'mobile/lib/features/live/**'
      - 'mobile/test/features/live/**'
      - 'mobile/web/media_player.*'
      - 'scripts/test-media-player.cjs'
      - 'scripts/smoke-live-media.cjs'

permissions:
  contents: read

concurrency:
  group: demo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test browser live playback protocol
        run: node --test ../scripts/test-media-player.cjs
      - name: Verify actual synthetic video and audio delivery
        timeout-minutes: 8
        run: node ../scripts/smoke-live-media.cjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true
      - name: Restore private demo signing key
        env:
          DEMO_KEYSTORE_B64: ${{ secrets.DEMO_ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$DEMO_KEYSTORE_B64"
          printf '%s' "$DEMO_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/livecommerce-demo.jks"
          chmod 600 "$RUNNER_TEMP/livecommerce-demo.jks"
      - name: Build installable release APK
        env:
          DEMO_KEYSTORE_PATH: ${{ runner.temp }}/livecommerce-demo.jks
          DEMO_KEYSTORE_PASSWORD: ${{ secrets.DEMO_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # The GitHub runner can give packaging more RAM without affecting PCs.
          sed -i 's/-Xmx1536m/-Xmx3072m/; s/MaxMetaspaceSize=512m/MaxMetaspaceSize=1024m/' android/gradle.properties
          flutter pub get
          flutter gen-l10n
          flutter analyze lib/features/live test/features/live
          flutter test test/features/live/live_room_role_test.dart
          flutter --verbose build apk --release --target-platform android-arm,android-arm64 \
            --build-name 0.1.2 --build-number "$((20261011 + GITHUB_RUN_NUMBER))" \
            --dart-define=API_BASE_URL=https://livecommerce-api.onrender.com/api/v1
      - name: Verify signature and prepare files
        run: |
          mkdir -p build/demo-apk
          cp build/app/outputs/flutter-apk/app-release.apk build/demo-apk/LiveCommerce-0.1.2.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs build/demo-apk/LiveCommerce-0.1.2.apk
          "$BUILD_TOOLS/aapt" dump badging build/demo-apk/LiveCommerce-0.1.2.apk > build/demo-apk/android-manifest.txt
          cd build/demo-apk
          sha256sum LiveCommerce-0.1.2.apk > SHA256SUMS.txt
          printf 'Source commit: %s\nAPI: https://livecommerce-api.onrender.com/api/v1\n' "$GITHUB_SHA" > build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LiveCommerce-Android-APK
          path: mobile/build/demo-apk/
          if-no-files-found: error
          retention-days: 30
