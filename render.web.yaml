# Frontend-only Blueprint. Does not create or modify paid backend services.
services:
  - type: web
    name: livecommerce-web
    runtime: static
    branch: feature/ux-polish-rc1
    rootDir: mobile
    buildCommand: sh tool/build_web.sh
    staticPublishPath: ./build/web
    envVars:
      - key: API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
