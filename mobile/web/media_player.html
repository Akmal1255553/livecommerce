<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>LiveCommerce — видео</title>
  <style>
    html,body,#media{margin:0;width:100%;height:100%;overflow:hidden;background:#12121c;color:#fff;font:15px system-ui}
    video{width:100%;height:100%;object-fit:cover}
    #notice{position:absolute;top:24%;left:8%;right:8%;text-align:center;pointer-events:none}
    #actions{position:absolute;bottom:22%;left:8%;right:8%;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    button{padding:12px 18px;border:0;border-radius:24px;background:#e93378;color:white;font:inherit;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="media"></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="actions"></div>
  <script src="media_player.js"></script>
</body>
</html>
