name: livecommerce_mobile
description: LiveCommerce mobile application — AI-powered live commerce platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  connectivity_plus: ^7.3.0
  video_player: ^2.13.0
  agora_rtc_engine: ^6.5.4
  permission_handler: ^12.0.3
  url_launcher: ^6.3.2
  sentry_flutter: ^8.14.2
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
